name: Collect metrics (daily)

on:
  schedule:
    # Agent usage artifacts expire after about 90 days, so collection has to be continuous.
    # A run already measured is read back from the stored JSON, so a daily run only pays for
    # what happened since yesterday.
    - cron: '15 3 * * *'
  workflow_dispatch:

concurrency:
  group: collect-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: agents-arc
    steps:
      # Minted before checkout so the repository is cloned with these credentials. A push made with
      # the default GITHUB_TOKEN does not trigger other workflows, which would leave collected data
      # committed but never deployed. An App token does trigger them.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Credentials are not persisted: the collection can outlast this token's hour, so the push
      # below sets its own fresh token instead of reusing one that may have expired. The branch tip
      # rather than the triggering commit: a run that queued behind another starts from the data that
      # one pushed, instead of measuring everything again and conflicting with it on push (#65).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A green collection run does not mean the numbers are right. Metrics degrade to
      # "unavailable" on purpose, so a regression can finish successfully having written nothing
      # useful, which is how two real bugs survived. Typecheck and tests run before any write.
      - name: Verify the collector before it writes anything
        run: pnpm --filter @project-health/collector run verify

      # Two months, not one. A run on the first of the month would otherwise write the new month
      # and never revisit the old one, losing everything that happened after the previous day's run
      # on the last day of the month. The second month is nearly free because runs already measured
      # are read back from the stored JSON instead of being fetched again.

      - name: Collect the current and previous month for every project
        env:
          # The App installation token. Needs Metadata, Contents, Deployments, Issues and
          # Actions read on every repository in projects.json. The collector runs a preflight and
          # skips any project it cannot read, rather than writing empty metrics over good data.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # With the App's own credentials the collector mints a new installation token before the
          # one above expires (they last an hour), so a long collection does not finish on a dead
          # token. GITHUB_TOKEN stays as the fallback if minting fails.
          GITHUB_APP_ID: ${{ secrets.BOT_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: pnpm --filter @project-health/collector run start --backfill 2

      # An installation token lasts one hour and a collection can take longer (the first run of a
      # month times every Actions run when the billing report is not readable), so the token minted
      # at the start can be dead by now. A second one is minted right before the push.
      - name: Generate a fresh App token for the push
        id: push-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Commit collected data
        env:
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --staged --quiet; then
            echo 'No metric changes to commit.'
          else
            git commit -m 'chore(data): refresh collected metrics'
            # A merge can land on main during the collection; data/ never conflicts with it.
            for attempt in 1 2 3; do
              git pull --rebase --quiet && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt was rejected; retrying."
              sleep $((attempt * 10))
            done
            exit 1
          fi
