name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'web/**'
      - 'config/**'
      - 'projects.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: agents-arc
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The site reads data/ from the repository at build time, so the export is a complete
      # snapshot and needs no server or database once deployed.
      - name: Build static export
        env:
          # Empty when the site is served from a custom domain at the root. Set it to
          # /project-health only if you drop the custom domain and use the github.io subpath.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: pnpm --filter @project-health/web run build

      # Actions based deploys do not run Jekyll, so this is only insurance against the _next
      # directory being treated as private if the build type ever changes.
      - name: Keep the custom domain across deploys
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        run: echo '${{ vars.PAGES_CUSTOM_DOMAIN }}' > web/out/CNAME

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
