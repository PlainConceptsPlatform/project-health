name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
  load:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: perf/smoke.js
